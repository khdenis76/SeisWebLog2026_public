<div
  class="tab-pane fade"
  id="source-bathy-map-pane"
  role="tabpanel"
  aria-labelledby="source-bathy-map-tab"
  data-options-url="{% url 'source_bathy_map_options' %}"
  data-generate-url="{% url 'source_generate_bathy_map' %}">

  <div class="card border-0 shadow-sm mb-2">
    <div class="card-body p-2">

      <div class="row g-2 align-items-end">

        <!-- MAP TYPE -->
        <div class="col-md-3">
          <label class="form-label small mb-1">Map type</label>

          <select id="source-bathy-map-type" class="form-select form-select-sm">
            <option value="bathymetry_3d">
              Bathymetry 3D Surface
            </option>

            <option value="sp_density_3d">
              SP Density 3D Surface
            </option>

            <option value="gun_depth_3d">
              Gun Depth 3D Surface
            </option>
          </select>
        </div>

        <!-- FIRE CODE -->
        <div class="col-md-2">
          <label class="form-label small mb-1">FireCode</label>

          <select id="source-bathy-fire-code"
                  class="form-select form-select-sm">
            <option value="A">A</option>
          </select>
        </div>

        <!-- CELL SIZE -->
        <div class="col-md-2 source-bathy-only">
          <label class="form-label small mb-1">
            Cell size, m
          </label>

          <input
            id="source-bathy-cell-size"
            type="number"
            class="form-control form-control-sm"
            value="100"
            min="5"
            step="5">
        </div>

        <!-- ALGORITHM -->
        <div class="col-md-2 source-bathy-only">
          <label class="form-label small mb-1">
            Algorithm
          </label>

          <select id="source-bathy-algorithm"
                  class="form-select form-select-sm">

            <option value="average">
              Average
            </option>

            <option value="nearest">
              Nearest
            </option>

            <option value="invdistnn">
              Inverse Distance NN
            </option>

            <option value="invdist">
              Inverse Distance
            </option>

          </select>
        </div>

        <!-- SEARCH RADIUS -->
        <div class="col-md-2 source-density-only d-none">
          <label class="form-label small mb-1">
            Search Radius, m
          </label>

          <input
            id="source-density-search-radius"
            type="number"
            class="form-control form-control-sm"
            value="1127"
            min="1"
            step="1">
        </div>

        <!-- CELLS PER RADIUS -->
        <div class="col-md-2 source-density-only d-none">
          <label class="form-label small mb-1">
            Cells / Radius
          </label>

          <input
            id="source-density-cells-per-radius"
            type="number"
            class="form-control form-control-sm"
            value="1"
            min="1"
            step="1">
        </div>

        <!-- DENSITY TYPE -->
        <div class="col-md-2 source-density-only d-none">
          <label class="form-label small mb-1">
            Density Type
          </label>

          <select id="source-density-type"
                  class="form-select form-select-sm">

            <option value="count">
              Point Count
            </option>

            <option value="gaussian" selected>
              Gaussian Kernel
            </option>

          </select>
        </div>

        <!-- AREA UNITS -->
        <div class="col-md-2 source-density-only d-none">
          <label class="form-label small mb-1">
            Area Units
          </label>

          <select id="source-density-area-units"
                  class="form-select form-select-sm">

            <option value="cell">
              Per Cell
            </option>

            <option value="sq_km" selected>
              Square Kilometers
            </option>

            <option value="sq_m">
              Square Meters
            </option>

          </select>
        </div>

        <!-- CLIP SHAPE -->
        <div class="col-md-3">
          <label class="form-label small mb-1">
            Clip shape
          </label>

          <select id="source-bathy-shape"
                  class="form-select form-select-sm">

            <option value="">
              No shape clipping
            </option>

          </select>
        </div>

        <!-- COLOR SCALE -->
        <div class="col-md-2">
          <label class="form-label small mb-1">
            Color scale
          </label>

          <select id="source-bathy-colorscale"
                  class="form-select form-select-sm">

            <option value="Earth">
              Earth
            </option>

            <option value="Viridis">
              Viridis
            </option>

            <option value="Turbo">
              Turbo
            </option>

            <option value="Jet">
              Jet
            </option>

            <option value="YlGnBu">
              YlGnBu
            </option>

          </select>
        </div>

        <!-- VERTICAL EXAGGERATION -->
        <div class="col-md-2">
          <label class="form-label small mb-1">
            Vertical exaggeration
          </label>

          <input
            id="source-bathy-ve"
            type="number"
            class="form-control form-control-sm"
            value="3"
            min="0.1"
            step="0.5">
        </div>

        <!-- EXPORT -->
        <div class="col-md-3">
          <label class="form-label small mb-1">
            Export
          </label>

          <div class="d-flex flex-wrap gap-2 small">

            <label class="form-check-label">
              <input
                id="source-bathy-export-tif"
                class="form-check-input me-1"
                type="checkbox"
                checked>
              TIF
            </label>

            <label class="form-check-label">
              <input
                id="source-bathy-export-html"
                class="form-check-input me-1"
                type="checkbox"
                checked>
              HTML
            </label>

            <label class="form-check-label">
              <input
                id="source-bathy-export-png"
                class="form-check-input me-1"
                type="checkbox">
              PNG
            </label>

          </div>
        </div>

        <!-- GENERATE -->
        <div class="col-md-3">
          <button
            id="source-bathy-generate-btn"
            class="btn btn-sm btn-primary w-100">

            <i class="fas fa-play me-1"></i>
            Generate map

          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- STATUS -->
  <div id="source-bathy-status"
       class="small text-muted mb-2">
  </div>

  <!-- RESULT -->
  <div id="source-bathy-result"
       class="card border-0 shadow-sm d-none">

    <div class="card-header py-2 d-flex justify-content-between align-items-center">

      <div>
        <i class="fas fa-globe me-1"></i>

        <span id="source-bathy-result-title">
          Map
        </span>
      </div>

      <div class="d-flex gap-2">

        <a
          id="source-bathy-open-link"
          class="btn btn-sm btn-outline-secondary disabled"
          href="#"
          target="_blank">

          Open HTML

        </a>

      </div>

    </div>

    <div class="card-body p-0 overflow-hidden">

      <div
        id="source-bathy-plotly"
        style="
          width:100%;
          height:calc(100vh - 260px);
          min-height:700px;
          resize:vertical;
          overflow:hidden;
        ">
      </div>

    </div>

  </div>

</div>
